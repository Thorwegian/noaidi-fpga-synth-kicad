#
# fixed_positions.toml -- where the parts a person interacts with sit
# (docs/requirements.md, Where the parts sit). scripts/board_from_circuit.py
# puts these parts where this file says; nothing else moves them.
#
#   edge          the board's edge the part's opening is at: left, top, right, bottom.
#                 The part keeps the way it is turned.
#   edge_line_mm  from the footprint's origin to the maker's board-edge line.
#                 A part without it is placed by eye, so that its plug can
#                 be inserted, and keeps the distance to the edge it is drawn at.
#   near          the pads the part sits as near to as it gets along its edge,
#                 as designator.pad: the middle of its own pads level with the
#                 middle of these. Without it the part keeps its place along
#                 the edge.
#   beside        the part it sits next to, at the same edge and turned the same way.
#   pitch_mm      centre to centre from that part, at least.
#   side          which side of that part it is on, left or right, as a
#                 person facing that edge from outside the board sees the two.
#
# scripts/squeeze_board.py slides a part with an edge along that edge, moves
# a part and the one it sits beside as one, and puts a part with near as
# near to those pads as it gets.

# The ESP32 module: its USB sockets and buttons.
[U1]
edge = "left"

# The Tang Nano 20K: its USB socket and buttons.
[U2]
edge = "right"

# The DAC module: its audio output socket.
[U5]
edge = "bottom"

# The MIDI sockets: MIDI 1 on the left and MIDI 2 on its right, as a
# person facing the top edge sees them. The socket's outline is 23.0 mm wide
# (the footprint's silkscreen); 24 mm leaves 1 mm between two of them, the
# room of a via.
[J1]
edge = "top"

[J2]
beside = "J1"
pitch_mm = 24.0
side = "right"

# The S/PDIF socket.
[J3]
edge = "top"

# The power socket. Hroparts' drawing of the TYPE-C-31-M-12
# (docs/thirdparty/Hroparts_TYPE-C-31-M-12_drawing.pdf, recommended PCB
# layout) puts the PCB edge 5.79 mm in front of the centres of the rear shell
# slots; the footprint has those at y = -3.13 mm: 5.79 - 3.13 = 2.66 mm.
[J9]
edge = "bottom"
edge_line_mm = 2.66

# The USB MIDI socket, the same part on the same board-edge line. It sits
# below the ESP32 module's two USB pins, where its data pair ends: the pair
# is then as short as it gets, and the socket is at the far end of the
# module from its antenna (circuit/antennas.toml).
[J14]
edge = "bottom"
edge_line_mm = 2.66
near = ["U1.25", "U1.26"]
