# fixed_positions.toml -- the constraints on where the parts sit
# (docs/requirements.md, Where the parts sit), as a layout manager takes
# them: a part has none of them, a few or many, of different kinds. A part
# this file does not name has none, and is placed in the cluster of the
# part at an edge that its block of the circuit has, beside what it
# connects to. scripts/place_parts.py places the parts to these constraints, and
# scripts/board_from_circuit.py keeps the parts this file names where they
# are when it brings the board up to the circuit.
#
# At an edge:
#   edge          the board's edge the part's opening is at: left, top, right,
#                 bottom. The part is turned to face this edge before it is
#                 placed anywhere.
#   faces         the side of the part a person plugs into, as its footprint
#                 is drawn: left, right, up or down. With it the part is
#                 turned so that side points at the edge above; without it
#                 the part keeps the turn it was drawn with.
#   edge_line_mm  from the footprint's origin to the maker's board-edge line,
#                 along the side that faces the edge. A part without it is
#                 placed by eye, so that its plug can be inserted, and keeps
#                 the distance to the edge it is drawn at.
#
# Against another part this file names, as the board is drawn, seen from
# its front:
#   below, above, left_of, right_of
#                 the part lies wholly on that side of the other. How far
#                 apart the two end up is for the script to work out.
#
# As one with another part:
#   beside        the part it sits next to, at the same edge and turned the
#                 same way: the two move as one.
#   pitch_mm      centre to centre from that part, at least.
#   side          which side of that part it is on, left or right, as a
#                 person facing that edge from outside the board sees the two.
#
# Drawn to pads of another part:
#   near          the pads the part sits level with along its edge, as
#                 designator.pad: the middle of its own pads level with the
#                 middle of these. For a part at an edge that meets the
#                 other part's edge at a corner.
#
# The board this file describes: the two MIDI sockets along the top; below
# them the ESP32 module across the board from the left edge; below that the
# two USB sockets at the left edge and, at the right edge, the Tang Nano
# with the DAC module below it; the S/PDIF socket at the bottom.

# The ESP32 module: its USB sockets and buttons. Its own board is the
# rectangle its footprint draws, 25.86 by 63.90 mm, with the two USB ports
# 7.01 mm past one end; the board edge that faces the board's left edge is
# 1.10 mm from the footprint's origin, so the ports hang over the edge.
[U1]
edge = "right"
faces = "up"
edge_line_mm = 1.10

# The USB MIDI socket. Hroparts' drawing of the TYPE-C-31-M-12
# (docs/thirdparty/Hroparts_TYPE-C-31-M-12_drawing.pdf, recommended PCB
# layout) puts the PCB edge 5.79 mm in front of the centres of the rear shell
# slots; the footprint has those at y = -3.13 mm: 5.79 - 3.13 = 2.66 mm.
# It is the first socket below the ESP32 module, whose two USB pins its
# data pair ends in, at the far end of the module from its antenna
# (circuit/antennas.toml).
[J14]
edge = "left"
faces = "down"
edge_line_mm = 2.66
below = "U1"

# The power socket, the same part on the same board-edge line.
[J9]
edge = "left"
faces = "down"
edge_line_mm = 2.66
below = "J14"

# The Tang Nano 20K: its USB socket and buttons. The module's own board is
# the rectangle its footprint draws on the silkscreen; its edge at that end
# is 27.60 mm from the footprint's origin.
[U2]
edge = "right"
faces = "down"
edge_line_mm = 11.60
below = "U1"

# The DAC module: its audio output socket. The module's own board is the
# rectangle its footprint draws; its edge at that end is 15.30 mm from the
# footprint's origin.
[U5]
edge = "right"
faces = "right"
edge_line_mm = 15.30
below = "U2"

# The MIDI sockets: MIDI 1 on the left and MIDI 2 on its right, as a
# person facing the top edge sees them. The socket's outline is 23.0 mm wide
# (the footprint's silkscreen); 24 mm leaves 1 mm between two of them, the
# room of a via. The body's front face, the moulded face the plug enters, is
# 6.51 mm from the footprint's origin, and sits on the board's edge with the
# body on the board.
[J1]
edge = "top"
faces = "up"
edge_line_mm = 12.41

[J2]
edge = "top"
faces = "up"
edge_line_mm = 12.41
beside = "J1"
pitch_mm = 24.0
side = "right"

# The S/PDIF socket. The body's face where the barrel starts, the part of it
# that goes over the edge, is 4.01 mm from the footprint's origin.
[J3]
edge = "bottom"
faces = "up"
edge_line_mm = 4.01
