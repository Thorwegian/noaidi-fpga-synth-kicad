#
# pair_paths.toml -- where each differential pair runs (docs/requirements.md,
# The layers). scripts/lay_pairs.py lays the pair's two tracks along its
# path, and the autorouter lays every other track around them.
#
#   name        the pair, as KiCad names it: its nets are <name>+ and <name>-.
#   layer       the copper layer the pair runs on, from end to end.
#   from, to    at each end, the two pads the pair ends in, as designator.pad.
#   path_mm     the points the line midway between the two tracks goes
#               through, from the one end to the other, each end short of
#               its pads. The script cuts the corners that turn by more
#               than 45 degrees, steps the pair onto the line midway
#               between the pads, and takes each track to its pad.
#   branch      a further pad of one of the pair's nets (a socket has each
#               line on two pads): the pad its track starts from (from),
#               the points it goes through as distances from that pad's
#               middle (offsets_mm), and the pad it ends in (to). Without
#               that pad it goes on in the direction of its last stretch
#               until it meets the net's track.
#
# Two tracks on one layer cannot change sides. The pads at the two ends are
# therefore chosen so that the net on the left of the path at one end is on
# its left at the other; the script refuses a path that asks for a crossing.

# The socket's data pads lie in the order D-, D+, D-, D+ (B7, A6, A7, B6),
# and the pair leaves it from A7 and B6: with D- on the left going up from
# the socket, D- is on the left under the ESP32 module's pins 25 and 26 too.
# The path goes up midway between the two CC resistors (R17, R18), then
# left below the edge of the antenna's keep-out, where the layer under it
# has no copper, and up between the module's two pins.
[[pair]]
name = "USB_D"
layer = "F.Cu"
from = ["J14.A7", "J14.B6"]
to = ["U1.25", "U1.26"]
path_mm = [[183.0, 163.8], [183.0, 161.3], [127.78, 161.3], [127.78, 160.2]]

# D-'s second pad is on D-'s side of the pair: its track goes up beside the
# pads and slants over to D-.
[[pair.branch]]
from = "J14.B7"
offsets_mm = [[0.0, -1.0], [0.5, -1.5]]

# D+'s second pad lies between D-'s two pads: its track goes around the far
# end of A7, under the socket, to D+'s first pad.
[[pair.branch]]
from = "J14.A6"
offsets_mm = [[0.0, 1.5], [1.0, 1.5]]
to = "J14.B6"
