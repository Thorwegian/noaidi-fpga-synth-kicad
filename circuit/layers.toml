#
# layers.toml -- the board's copper layers, from the front to the back, and
# what each carries (docs/requirements.md, The layers).
# scripts/board_from_circuit.py gives the board these layers and their fills.
#
#   name    KiCad's name of the layer.
#   fill    the net the layer is filled with, over the whole board.
#   tracks  whether tracks are laid on the layer. Where they are, the fill
#           flows around them; where they are not, the fill is whole.
#
# No track is laid on the net of a fill: its pads are joined by the fill
# (scripts/route.sh).
#
# A fill on a layer with tracks is cut into pieces by them, and a piece is
# joined to the rest only through another layer filled with the same net.
# Ground is therefore the one net filled on the layers with tracks, and it
# has the inner layer under the front as well. One inner layer is left for a
# supply: ESP_3V3 has 13 pads, NANO_5V has 5 and is joined by tracks.

[[layer]]
name = "F.Cu"
fill = "GND"
tracks = true

[[layer]]
name = "In1.Cu"
fill = "GND"
tracks = false

[[layer]]
name = "In2.Cu"
fill = "ESP_3V3"
tracks = false

[[layer]]
name = "B.Cu"
fill = "GND"
tracks = true
